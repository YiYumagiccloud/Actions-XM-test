name: 构建 MHW 模组

on:
  # 纯手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（作为 Release 的 tag，例如 v1.0.0）'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 配置 MSVC 编译环境
      uses: ilammy/msvc-dev-cmd@v1

    - name: 配置 CMake
      run: cmake -B ${{ github.workspace }}/build -S ${{ github.workspace }}/ChainsawPhial -A x64

    - name: 编译（Release）
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: 准备发布文件
      run: |
        mkdir output
        copy build\Release\ChainsawPhial.dll output\

    - name: 上传构建产物（Artifact）
      uses: actions/upload-artifact@v4
      with:
        name: ChainsawPhial-DLL
        path: output/ChainsawPhial.dll

    - name: 自动创建 Release 并上传 DLL
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: MHW ChainsawPhial ${{ github.event.inputs.version }}
        files: output/ChainsawPhial.dll
        generate_release_notes: true
        target_commitish: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

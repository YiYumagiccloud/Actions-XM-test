name: Build MHW Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -S ${{github.workspace}}/ChainsawPhial -A x64

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Prepare Release Asset
      run: |
        mkdir output
        copy build\Release\ChainsawPhial.dll output\

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChainsawPhial-DLL
        path: output/ChainsawPhial.dll

    # 可选：如果你在仓库打了 tag，自动发布到 Release
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: output/ChainsawPhial.dll
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 打包 · 金手指格式转换器

on:
  workflow_dispatch:
  push:
    tags:
      - '金手指-v*'
    paths:
      - 'Pywebview/金手指格式转换器/**'

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
      CI: 'true'

    defaults:
      run:
        working-directory: Pywebview/金手指格式转换器

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            Pywebview/金手指格式转换器/requirements.txt
            Pywebview/金手指格式转换器/requirements-build.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: 源码自检
        run: python 主程序.py --selfcheck

      - name: PyInstaller 打包
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name JinshouzhiConverter `
            --collect-all webview `
            --hidden-import=clr_loader `
            --hidden-import=pythonnet `
            --hidden-import=clr `
            --add-data "前端;前端" `
            --add-data "图片素材;图片素材" `
            --icon "图片素材\湍流模型.ico" `
            主程序.py

      - name: 复制 Python.Runtime.dll
        shell: pwsh
        run: |
          $dst = "dist\JinshouzhiConverter"
          $src = python -c "import pythonnet, os; print(os.path.join(os.path.dirname(pythonnet.__file__), 'runtime'))"
          Write-Host "runtime 源目录：$src"
          Copy-Item "$src\*" -Destination $dst -Force -Recurse
          Get-ChildItem "$dst\Python.Runtime.dll" | Select-Object Name, Length

      - name: 检查产物
        shell: pwsh
        run: |
          Get-ChildItem dist\JinshouzhiConverter\ -Filter *.exe
          if (-not (Test-Path dist\JinshouzhiConverter\Python.Runtime.dll)) {
            throw "Python.Runtime.dll 缺失，打包不完整"
          }
          Write-Host "Python.Runtime.dll 已包含"

      - name: 打包产物
        shell: pwsh
        run: |
          Compress-Archive -Path dist\JinshouzhiConverter\* `
            -DestinationPath dist\金手指格式转换器-windows.zip -Force

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 金手指格式转换器-windows
          path: Pywebview/金手指格式转换器/dist/金手指格式转换器-windows.zip
          if-no-files-found: error

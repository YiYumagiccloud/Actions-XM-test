name: 打包 · 金手指格式转换器

on:
  workflow_dispatch:
  push:
    tags:
      - '金手指-v*'
    paths:
      - 'Pywebview/金手指格式转换器/**'

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
      CI: 'true'

    defaults:
      run:
        working-directory: Pywebview/金手指格式转换器

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: |
            Pywebview/金手指格式转换器/requirements.txt
            Pywebview/金手指格式转换器/requirements-build.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: 查看环境
        run: |
          python -m nuitka --version
          python -c "import pefile; print('pefile', pefile.__version__)"

      - name: 源码自检
        run: python 主程序.py --selfcheck

      - name: Nuitka 编译
        run: |
          python -m nuitka `
            --standalone `
            --msvc=latest `
            --assume-yes-for-downloads `
            --windows-dependency-tool=pefile `
            --nofollow-import-to=webview.platforms.android `
            --include-package-data=webview `
            --include-package=clr_loader `
            --include-package=pythonnet `
            --include-data-dir=前端=前端 `
            --include-data-dir=图片素材=图片素材 `
            --windows-icon-from-ico=图片素材/湍流模型.ico `
            --output-dir=build `
            --output-filename=JinshouzhiConverter.exe `
            主程序.py

      - name: 复制 pythonnet runtime 目录
        shell: pwsh
        run: |
          $rt = python -c "import pythonnet, os; print(os.path.join(os.path.dirname(pythonnet.__file__), 'runtime'))"
          Write-Host "runtime 目录：$rt"
          Copy-Item "$rt\*" -Destination build\主程序.dist\ -Force -Recurse
          Get-ChildItem build\主程序.dist\Python.Runtime.dll | Select-Object Name, Length

      - name: 打包产物
        run: |
          Compress-Archive -Path build\主程序.dist\* -DestinationPath build\金手指格式转换器-windows.zip -Force
        shell: pwsh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 金手指格式转换器-windows
          path: Pywebview/金手指格式转换器/build/金手指格式转换器-windows.zip
          if-no-files-found: error
